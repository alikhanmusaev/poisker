log_format poisker_safe '$remote_addr - [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_user_agent"';

server {
    listen 80;
    server_name poisker.ru www.poisker.ru;
    server_tokens off;
    access_log /var/log/nginx/access.log poisker_safe;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://poisker.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.poisker.ru;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/poisker.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poisker.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://poisker.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name poisker.ru;
    server_tokens off;
    access_log /var/log/nginx/access.log poisker_safe;
    client_max_body_size 25M;

    ssl_certificate /etc/letsencrypt/live/poisker.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poisker.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /board-images/ {
        set $storage minio:9000;
        proxy_pass http://$storage/board-images/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        expires 30d;
    }

    location / {
        set $backend web:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_buffering on;
    }
}
