log_format poisker_safe '$remote_addr - [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_user_agent"';

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log poisker_safe;
    # Django accepts images up to 20 MiB; reject larger uploads before they
    # occupy an application worker or reach object storage.
    client_max_body_size 25M;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Docker's embedded DNS keeps service names valid after container recreation.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Public listing photos are stored privately in the MinIO service; expose
    # only the application bucket through the same public origin.
    location /board-images/ {
        set $storage minio:9000;
        proxy_pass http://$storage/board-images/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        expires 30d;
    }

    location / {
        set $backend web:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_buffering on;
        # Keep server-rendered pages fresh; assets use versioned immutable URLs.
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }
}
