{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#b91c1c">
  <title>Ошибка сервера — {{ site_name }}</title>
  <link rel="stylesheet" href="{% static 'fonts/inter/inter.css' %}?v={{ static_version }}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v={{ static_version }}">
  <style>
    .error-fallback { font-family: system-ui, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    .error-fallback .auth-page { max-width: 440px; margin: 48px auto; padding: 0 16px; }
    .error-fallback .page-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 28px 20px; text-align: center; }
    .error-fallback .error-code { font-size: 56px; font-weight: 800; letter-spacing: -0.06em; color: #fee2e2; margin: 0 0 8px; }
    .error-fallback h1 { font-size: 24px; margin: 0 0 8px; }
    .error-fallback p { color: #64748b; margin: 0 0 20px; }
    .error-fallback a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px; background: #b91c1c; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body class="auth-body error-fallback">
  <main class="site-main" role="main">
    <div class="container">
      <div class="auth-page error-page">
        <div class="page-card auth-card">
          <div class="auth-card-header">
            <p class="error-code" aria-hidden="true">500</p>
            <h1 class="page-title">На сервере произошла ошибка</h1>
            <p class="page-lead">Попробуйте обновить страницу через минуту. Если ошибка повторяется — вернитесь на главную.</p>
          </div>
          <div class="auth-footer">
            <a href="/" class="btn btn-primary btn-block">На главную</a>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
