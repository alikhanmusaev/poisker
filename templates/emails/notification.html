<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body style="margin:0;padding:0;background:#f5f7fa;color:#172033;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f5f7fa;">
      <tr><td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;background:#ffffff;border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;">
          <tr><td style="padding:20px 28px;background:#ffffff;border-bottom:1px solid #eef0f3;">
            <img src="{{ logo_url }}" width="40" height="40" alt="{{ site_name }}" style="display:inline-block;width:40px;height:40px;vertical-align:middle;border:0;outline:none;text-decoration:none;">
            <span style="margin-left:9px;color:#172033;font-size:20px;font-weight:700;vertical-align:middle;">{{ site_name }}</span>
          </td></tr>
          <tr><td style="padding:32px 28px 16px;">
            {% if user_name %}<p style="margin:0 0 12px;color:#667085;font-size:15px;line-height:22px;">Здравствуйте, {{ user_name }}!</p>{% endif %}
            <h1 style="margin:0;color:#172033;font-size:26px;line-height:34px;font-weight:700;">{{ title }}</h1>
          </td></tr>
          <tr><td style="padding:8px 28px 28px;">
            <div style="padding:18px 20px;border-radius:12px;background:#f8fafc;border:1px solid #e9edf2;color:#344054;font-size:16px;line-height:24px;">{{ body }}</div>
            {% if action_url %}
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin-top:24px;"><tr><td style="border-radius:9px;background:#c91d1d;">
                <a href="{{ action_url }}" style="display:inline-block;padding:13px 20px;color:#ffffff;font-size:16px;line-height:20px;font-weight:700;text-decoration:none;">{{ action_label }}</a>
              </td></tr></table>
            {% endif %}
          </td></tr>
          <tr><td style="padding:20px 28px;background:#fafbfc;border-top:1px solid #eef0f3;color:#98a2b3;font-size:13px;line-height:20px;">
            Это сервисное уведомление по вашему аккаунту. Если нужна помощь — ответьте на это письмо или напишите на <a href="mailto:{{ support_email }}" style="color:#667085;text-decoration:underline;">{{ support_email }}</a>.
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
